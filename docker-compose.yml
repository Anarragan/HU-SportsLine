services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sportsline-app
    restart: always
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      - db
    command: ["pm2-runtime", "ecosystem.config.cjs"]
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: "0.5"       # Limita el uso máximo a medio núcleo
          memory: 512M      # Limita la memoria RAM a 512 MB
        reservations:
          cpus: "0.25"      # Reserva 1/4 de CPU
          memory: 256M      # Reserva 256 MB
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3002 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15-alpine
    container_name: sportsline-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"   # Puedes comentar esto si no necesitas acceso externo
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: "1.0"     # 1 núcleo máximo
          memory: 1G      # 1 GB de RAM máximo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

networks:
  backend_net:
    driver: bridge
